# deskswitch config: ~/.config/deskswitch/config.ini (one per Mac).
# The two Macs get the same file with this_input / peer_input swapped.

[monitor]
# Substring of the monitor's name as BetterDisplay shows it.
name = ZQE-CAA
# VCP 0x60 values. Learn them with `deskswitch.py ddc get` on the Mac that is
# currently on screen (README: "Find your input codes"). MCCS defaults are
# DP-1=15, DP-2=16, HDMI-1=17, HDMI-2=18, USB-C usually 27, but Huawei may differ.
this_input =
peer_input =
# betterdisplay (works on every Mac port incl. built-in HDMI; app must be running)
# m1ddc         (USB-C / DisplayPort; cannot read the current input)
# custom        (use the [commands] templates below)
backend = betterdisplay
m1ddc_display =
# Seconds to wait after switching before running hooks.
settle = 0

[commands]
# Optional overrides. {name} and {value} are substituted. Examples:
# set = betterdisplaycli set -nameLike={name} -feature=ddc -vcp=0x60 -value={value}
# get = betterdisplaycli get -nameLike={name} -feature=ddc -vcp=0x60 -value
# set = m1ddc set input {value}
set =
get =

[devices]
# ioreg       : Bluetooth-paired keyboard/mouse (no extra permissions)
# optionsplus : ask the Logi Options+ agent (needed with a Logi Bolt receiver)
presence = ioreg
keyboard = MX Keys
mouse = MX Master

[follow]
# pull: when the devices arrive on this Mac, point the monitor here.
#       Needs the monitor to accept DDC on an input it is not showing (README test).
pull = yes
# push: when the devices leave this Mac while you were using them, point the
#       monitor at peer_input. This always works (the Mac you leave is the one on
#       screen), so calibrate turns it on.
push = no
# keyboard: the monitor follows the keyboard. A mouse-only switch (button under
#           the MX Master) then works as a "peek" that leaves the monitor alone.
arrive_on = keyboard
leave_on = all
poll = 0.7
debounce = 2
cooldown = 6
# Push only if an input device was used within this many seconds before the
# devices left (filters out the devices going to sleep).
active_window = 10

[logi]
# 0-based Easy-Switch channel that the OTHER Mac is paired on (channel 1 = 0).
peer_host =

[hooks]
# Shell commands, e.g. a notification or a BetterDisplay Pro mirror/disconnect.
after_here =
after_away =
